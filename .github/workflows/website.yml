# CI for the FoodOS.ai marketing site (website/).
# Owned by DevOps (FOO-4). Stack decision: docs/website-architecture.md.
#
# Three jobs:
#   secret-scan  — gitleaks over the repo, so no credential ever lands in git
#   verify       — install, lint, typecheck, test, build
#   deploy       — uploads to Cloudflare Pages (direct upload)
#
# GitHub Actions is the ONLY deploy path (CTO decision, 2026-10-13). The
# Cloudflare Pages Git integration is deliberately not connected — connecting it
# as well would build and deploy the site twice on every push.
#
# `deploy` is live. It needs three repo-level settings to exist; until they do it
# fails fast with an explanatory message rather than a cryptic wrangler error.
# See docs/runbooks/website-setup.md step 7.

name: website

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Default to read-only. The deploy job raises what it needs explicitly.
permissions:
  contents: read

# A new push to the same branch cancels the previous run. Never cancel main:
# a half-finished deploy is worse than a slow one.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 24, not 22: the test suite is written against the built-in `node:test`
  # runner and imports `.ts` files directly, which relies on Node's native type
  # stripping. That is stable from Node 24. This is the only place the Node
  # version is pinned — Cloudflare never builds the site, it only receives
  # `dist/`, so there is no NODE_VERSION to keep in step on the Pages project.
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip, so it catches a secret
          # that was committed and then "removed" in a later commit.
          fetch-depth: 0

      # Installed from the pinned release tarball rather than gitleaks-action,
      # which requires a paid licence key for organisation-owned repos.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` (not `npm install`) so CI builds exactly the committed
      # lockfile and fails loudly if package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # No real secrets here: the build only needs the public Turnstile site
      # key, and CI uses Cloudflare's dummy key so PRs from forks still build.
      - name: Build
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'

      # Guards the two things that silently break a Pages deploy: a missing
      # entrypoint, and _headers not being copied out of public/ into dist/.
      - name: Check build output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/_headers  || { echo "::error::dist/_headers missing — is it in website/public/?"; exit 1; }
          echo "dist/ looks deployable:"
          ls -la dist

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # DEPLOY — Cloudflare Pages, direct upload. This is the only deploy path.
  # ---------------------------------------------------------------------------
  # push to main  -> production deploy  (foodos.ai)
  # pull request  -> preview deploy     (<branch>.foodos-website.pages.dev)
  #
  # Preview deploys replace what the Pages Git integration would have given us
  # for free. They are skipped for pull requests from forks, which by design
  # cannot read repository secrets.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: [secret-scan, verify]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      # `production` is a protected GitHub environment — add required reviewers
      # there if you ever want a manual gate before the live site changes.
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      # Fails with a readable message if the runbook's step 7 has not been done,
      # instead of letting wrangler fail on an empty API token.
      - name: Check deploy credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$CF_API_TOKEN" ]  || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ -n "$CF_ACCOUNT_ID" ] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          [ -n "$SITE_KEY" ]      || missing+=("variable TURNSTILE_SITE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not configured for deploy. Missing: ${missing[*]}."
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            echo "::error::Full instructions: docs/runbooks/website-setup.md (step 7)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # Built here, not reused from `verify`: that build deliberately uses the
      # dummy Turnstile key so fork PRs can still build. A deployable bundle
      # needs the real (public) site key compiled in.
      - name: Build
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      # The branch name decides the Pages environment: `main` is production,
      # anything else is a preview. Runtime secrets and vars come from the Pages
      # project, not from here — see docs/runbooks/website-setup.md step 6.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `defaults.run.working-directory` does not apply to actions.
          workingDirectory: website
          command: >-
            pages deploy dist
            --project-name=foodos-website
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Summarise
        run: |
          {
            echo "### Deployed to Cloudflare Pages"
            echo
            echo "- Environment: **${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}**"
            echo "- Branch: \`${{ github.head_ref || github.ref_name }}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
