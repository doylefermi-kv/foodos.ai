# CI for the FoodOS.ai marketing site (website/).
# Owned by DevOps (FOO-4). Stack decision: docs/website-architecture.md.
#
# Two jobs run on every PR and on main:
#   secret-scan  — gitleaks over the repo, so no credential ever lands in git
#   verify       — install, lint, typecheck, test, build
#
# A third job, `deploy`, is written and ready but DISABLED (`if: false`).
# The CTO enables it; see docs/runbooks/website-setup.md step 9.

name: website

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Default to read-only. The deploy job raises what it needs explicitly.
permissions:
  contents: read

# A new push to the same branch cancels the previous run. Never cancel main:
# a half-finished deploy is worse than a slow one.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 24, not 22: the test suite is written against the built-in `node:test`
  # runner and imports `.ts` files directly, which relies on Node's native type
  # stripping. That is stable from Node 24. Keep this in step with the
  # NODE_VERSION set on the Cloudflare Pages project (runbook step 6).
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip, so it catches a secret
          # that was committed and then "removed" in a later commit.
          fetch-depth: 0

      # Installed from the pinned release tarball rather than gitleaks-action,
      # which requires a paid licence key for organisation-owned repos.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` (not `npm install`) so CI builds exactly the committed
      # lockfile and fails loudly if package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # No real secrets here: the build only needs the public Turnstile site
      # key, and CI uses Cloudflare's dummy key so PRs from forks still build.
      - name: Build
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'

      # Guards the two things that silently break a Pages deploy: a missing
      # entrypoint, and _headers not being copied out of public/ into dist/.
      - name: Check build output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/_headers  || { echo "::error::dist/_headers missing — is it in website/public/?"; exit 1; }
          echo "dist/ looks deployable:"
          ls -la dist

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # DEPLOY — DISABLED. Do not enable until the CTO has completed the runbook.
  # ---------------------------------------------------------------------------
  # To enable:
  #   1. Finish docs/runbooks/website-setup.md (Pages project + secrets exist).
  #   2. Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
  #   3. Change `if: false` below to:
  #        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #
  # Note: Cloudflare Pages can also build from the Git integration directly.
  # If the CTO connects the repo in the Pages dashboard instead, DELETE this
  # job rather than enabling it — running both deploys the site twice.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: [secret-scan, verify]
    if: false # <-- CTO: see the comment above before changing this.
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `defaults.run.working-directory` does not apply to actions.
          workingDirectory: website
          command: pages deploy dist --project-name=foodos-website --branch=main
