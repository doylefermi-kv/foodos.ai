# CI/CD for the FoodOS.ai marketing site (website/).
#
# Owned by DevOps (FOO-6). Stack decision: "Revision 2" in
# docs/website-architecture.md — GitHub Pages, deployed by GitHub Actions.
# There is no Cloudflare anywhere in this pipeline.
#
# Three jobs:
#   secret-scan  gitleaks over the full history, so no credential lands in git
#   verify       install, lint, typecheck, test, build, gate the build output
#   deploy       main only — build with the live endpoint, publish to Pages
#
# The repo is a monorepo. Every trigger is filtered to `website/**` so a future
# package cannot deploy the marketing site by accident.

name: website

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Read-only by default. `deploy` raises exactly what Pages needs and nothing
# else; no other job can write anything.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run. Never cancel main:
# a half-finished deploy is worse than a slow one, and `deploy-pages` does not
# tolerate being interrupted mid-publish.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 24, not 22: the test suite uses the built-in `node:test` runner and imports
  # `.ts` files directly, which relies on Node's native type stripping. That is
  # stable from Node 24.
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.30.1'
  # The site is a GitHub Pages *project* site, so it is served from the repo
  # name as a sub-path. This is the single source of truth for that: it is the
  # Vite `base`, and the value `check:dist` asserts every asset URL against.
  # On a custom domain this becomes `/` — see docs/runbooks/website-setup.md.
  BASE_PATH: '/foodos.ai/'
  SITE_ORIGIN: 'https://doylefermi-kv.github.io'

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gitleaks scans history, not just the tip, so it catches a secret
          # that was committed and then "removed" in a later commit.
          fetch-depth: 0

      # Installed from the pinned release tarball rather than gitleaks-action,
      # which requires a paid licence key for organisation-owned repos.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` (not `npm install`) so CI builds exactly the committed lockfile
      # and fails loudly if package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Deliberately built WITHOUT VITE_DEMO_REQUEST_URL. Repository variables
      # are not exposed to pull requests from forks, so depending on one here
      # would make every fork PR fail; and the "not configured" path is a real
      # state the form must handle, so building it is a check, not a gap.
      - name: Build
        run: npm run build

      - name: Gate the build output
        run: npm run check:dist

      - name: Upload build output
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # DEPLOY — GitHub Pages. Runs on main (and workflow_dispatch) only.
  # ---------------------------------------------------------------------------
  # Prerequisite, one time: Settings > Pages > Source = "GitHub Actions".
  # Without it this job fails at `configure-pages` with "Pages is not enabled".
  # docs/runbooks/website-setup.md, step 1.
  deploy:
    name: Deploy to GitHub Pages
    needs: [secret-scan, verify]
    # main only. `push` is already filtered to main; this also stops a
    # `workflow_dispatch` on a side branch from publishing it to the live site,
    # and stops pull requests dead. There is one Pages site and it is main's.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The three Pages needs, and nothing more: read the code, mint the OIDC
    # token `deploy-pages` authenticates with, and publish.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install
        working-directory: website
        run: npm ci

      # A warning, not a failure: until the CTO has deployed the Apps Script and
      # run `gh variable set DEMO_REQUEST_URL`, the right behaviour is to ship a
      # site whose form says "not configured" — not to block the whole deploy.
      - name: Check the lead endpoint is configured
        env:
          DEMO_REQUEST_URL: ${{ vars.DEMO_REQUEST_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEMO_REQUEST_URL}" ]; then
            echo "::warning::Repository variable DEMO_REQUEST_URL is not set. The site will deploy with the demo form in its 'not configured' state. Fix: gh variable set DEMO_REQUEST_URL -R ${{ github.repository }} — see docs/runbooks/website-setup.md step 5."
          else
            echo "DEMO_REQUEST_URL is set (${#DEMO_REQUEST_URL} chars)."
          fi

      # Built here rather than reusing `verify`'s artifact: that build has no
      # endpoint compiled in. VITE_* values end up in the shipped JavaScript and
      # are public by definition, which is why the /exec URL is a repository
      # *variable* and not a secret.
      - name: Build
        working-directory: website
        run: npm run build
        env:
          VITE_DEMO_REQUEST_URL: ${{ vars.DEMO_REQUEST_URL }}

      - name: Gate the build output
        working-directory: website
        run: npm run check:dist

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Summarise
        env:
          DEMO_REQUEST_URL: ${{ vars.DEMO_REQUEST_URL }}
        run: |
          {
            echo "### Deployed to GitHub Pages"
            echo
            echo "- URL: ${{ steps.deploy.outputs.page_url }}"
            echo "- Base path: \`${BASE_PATH}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [ -z "${DEMO_REQUEST_URL}" ]; then
              echo "- Demo form: **not configured** — set the \`DEMO_REQUEST_URL\` repository variable and re-run."
            else
              echo "- Demo form: configured."
            fi
            echo
            echo "Rollback: re-run the last known-good run of this workflow from the Actions tab."
          } >> "$GITHUB_STEP_SUMMARY"
