# Cloudflare Pages configuration for the FoodOS.ai marketing site.
#
# Owned by DevOps (FOO-4). Stack decision: docs/website-architecture.md.
#
# This file configures BOTH the static site and the Pages Functions in
# `website/functions/`. There are no secrets here and there never should be —
# see docs/runbooks/website-setup.md for where each secret actually lives.

name = "foodos-website"

# Vite's default output directory. Frontend must keep `build.outDir` at `dist`.
pages_build_output_dir = "dist"

# Pins the Workers runtime API surface. Bump this deliberately, not casually:
# changing it can change runtime behaviour of the Functions.
compatibility_date = "2026-10-13"

# Needed if the Functions use Node built-ins (e.g. a Google auth/JWT library).
# Backend: tell DevOps if you don't need this and we'll drop it.
compatibility_flags = ["nodejs_compat"]

# -----------------------------------------------------------------------------
# Environment variables
# -----------------------------------------------------------------------------
# Only NON-SECRET values belong here. Every value in this file is committed to
# git and visible to anyone with repo access.
#
# IMPORTANT — this file is the source of truth, not the dashboard. Cloudflare's
# rule for Pages projects that ship a wrangler config: plaintext variables
# declared here overwrite the dashboard's on every deploy, and the dashboard
# shows them read-only. So a variable the Function needs in production must be
# written here, not added in the UI, or the next deploy will wipe it.
#   https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# Encrypted variables are the exception: wrangler never deletes a secret it did
# not set. TURNSTILE_SECRET_KEY, GOOGLE_SHEET_ID, GOOGLE_SERVICE_ACCOUNT_EMAIL
# and GOOGLE_PRIVATE_KEY are therefore set once in the dashboard (or with
# `wrangler pages secret put`) and survive every deploy. Locally they come from
# `website/.dev.vars`, which is gitignored — see `.dev.vars.example`.
#
# Scope of each block:
#   [vars]                 -> `wrangler pages dev`, and production as a fallback
#   [env.preview.vars]     -> preview deploys
#   [env.production.vars]  -> production deploys
#
# LEAD_SINK is repeated in all three on purpose. READ THIS BEFORE "TIDYING" IT:
#
# wrangler does NOT inherit `vars` into named environments — it will even warn
# you about a top-level var missing from an env block. `wrangler pages deploy`
# picks the environment from the branch and re-reads this file with
# `env: "production"` or `env: "preview"`; there is no `--env` flag.
#
# Today, deleting [env.production.vars] still happens to work, because wrangler
# falls back to top-level [vars] when the named env block is absent entirely
# (verified with `unstable_readConfig` against this file: all three of
# production, preview and top-level resolve to `google_sheet`). But that
# fallback holds only while there is NO [env.production] block at all. The
# moment anyone adds one for an unrelated reason — a compatibility flag, a KV
# binding — `vars` stops being inherited and LEAD_SINK silently disappears from
# production.
#
# That failure is silent and expensive: `selectSink` defaults to `console`, so
# every lead would return 201 to the visitor and be written only to the
# Cloudflare log, never to the sheet. Nobody finds out until someone asks why
# the sheet is empty. Three duplicated lines are cheaper than that.
#
# Local dev is unaffected either way: `.dev.vars` overrides [vars], which is why
# this file can safely say `google_sheet` while a fresh clone runs on `console`.
# Verified both directions — see docs/runbooks/website-setup.md, Appendix B.

[vars]
# `google_sheet` with an underscore is the agreed spelling (CTO, 2026-10-13).
# The hyphenated alias still works but logs a deprecation warning; Backend
# removes it once a deploy has been seen writing rows.
LEAD_SINK = "google_sheet"

# Preview writes to the same sheet as production — the CTO's call; the `status`
# column is there to mark test rows.
[env.preview.vars]
LEAD_SINK = "google_sheet"

[env.production.vars]
LEAD_SINK = "google_sheet"
