<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ===================================================================
         Security headers (DevOps, FOO-6). READ BEFORE EDITING.

         GitHub Pages cannot set response headers at all, so the FOO-4 policy
         that lived in `public/_headers` (a Cloudflare/Netlify convention, which
         Pages ignores and would serve as a public file) moves here. QA verified
         a meta-tag CSP is genuinely enforced on this build — 21/21 checks,
         including a blocked cross-origin POST (qa/reports/FOO-9, harness
         14-meta-csp.mjs).

         Deliberately accepted as lost on Pages, no meta equivalent exists:
         X-Frame-Options / frame-ancestors (the site IS frameable — measured,
         not assumed), Permissions-Policy, COOP/CORP, X-Content-Type-Options and
         Strict-Transport-Security. Recorded as a decision in
         docs/runbooks/website-setup.md ("What this host cannot give us").
         `frame-ancestors` is omitted rather than kept: a meta tag cannot carry
         it, and leaving it in only logs an ignored-directive console warning.

         Third parties allowed, and why — this is the whole list:
           script.google.com / script.googleusercontent.com   the Apps Script
             /exec lead endpoint, in connect-src: the POST plus the redirect it
             follows. Both origins are required.
         No external fonts, no CDN, no analytics. Adding any of those means
         editing this line and re-running the QA harness.
         'unsafe-inline' on style-src is required for React's inline styles.
         ==================================================================== -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests"
    />
    <!-- The one FOO-4 header that does survive as a meta tag. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>FoodOS.ai — restaurant POS with AI built in</title>
    <meta
      name="description"
      content="The restaurant POS built for how Indian restaurants actually run: GST bills in one tap, KOTs to the kitchen, Zomato and Swiggy in one queue, and AI that tells you what to prep tomorrow. Works offline. Nine languages."
    />
    <!-- Asset URLs below are written against %BASE_URL% — the site is served
         from a sub-path on GitHub Pages (/foodos.ai/) and from / on the real
         domain. The page's own URL (canonical, og:url) can't be: it has to be
         absolute, so it names the production site here and src/lib/meta.ts
         corrects it on boot to whatever origin actually served the page. -->
    <link rel="canonical" href="https://foodos.ai/" />
    <meta name="theme-color" content="#FFB703" />

    <!-- Open Graph / Twitter. og:image is a PLACEHOLDER built from the
         wordmark — replace with a real 1200×630 render before launch. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FoodOS.ai" />
    <meta property="og:title" content="FoodOS.ai — restaurant POS with AI built in" />
    <meta
      property="og:description"
      content="Bill fast. Waste less. Know your numbers. GST bills, KOT, Zomato and Swiggy in one queue, and AI that tells you what to prep tomorrow."
    />
    <meta property="og:url" content="https://foodos.ai/" />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FoodOS.ai — restaurant POS with AI built in" />
    <meta
      name="twitter:description"
      content="Bill fast. Waste less. Know your numbers. The POS built for Indian restaurants, with AI built in."
    />
    <meta name="twitter:image" content="%BASE_URL%og-image.png" />

    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
