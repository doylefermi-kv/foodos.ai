<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FoodOS.ai — og:image source (1200×630)</title>
<style>
/* ============================================================
   FoodOS.ai — SOCIAL CARD SOURCE, 1200 x 630.
   Render with:
     chrome --headless --window-size=1200,630 \
            --screenshot=og-image.png og-image.html

   CROP DISCIPLINE. Link previews do not all show 1.91:1:
     · 1200x630 full      WhatsApp large, LinkedIn, Slack, Facebook
     · 1200x600 (2:1)     X / Twitter summary_large_image
     · 630x630  centre    WhatsApp + iMessage small thumbnails
   So every piece of content — logo, headline, sub, chips — lives
   inside the centred 630-wide column (x 285..915). The outer
   columns carry only the torn-chit motif, which is the one thing
   that can be cropped away without losing the message.

   MOTIF vs LOGO. The chit is now the logo, so the margin chits are
   drawn as tinted outlines only — no solid ink field, no marigold
   fill. The logo tile is the single filled chit on the card, and
   the motif reads as the same object repeated in the background
   rather than four rivals to the mark.

   No external fonts, no CDNs. Palette is design/system/tokens.css,
   inlined here so this file renders standalone.
   ============================================================ */

:root{
  --paper:#FFFCF5; --paper-2:#FFF7E6;
  --ink:#16130F;   --ink-2:#4A443B;
  --marigold:#FFB703; --mint-l:#D6F2E6; --sky:#BFE3F5;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  width:1200px; height:630px; overflow:hidden; position:relative;
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
}
svg{ display:block; }

/* ---- top ticker band ---- */
.ticker{
  /* 52px, not 46: X crops 1200x630 to 2:1, losing 15px top and
     bottom. At 46px the ticker type sat 1px inside that cut. */
  position:absolute; inset:0 0 auto 0; height:52px;
  background:var(--ink); color:var(--paper);
  display:flex; align-items:center; gap:34px; padding:0 26px;
  font-family:var(--mono); font-size:14px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;
}
.ticker b{ color:var(--marigold); font-weight:700; }

/* ---- bottom band ---- */
.foot{
  position:absolute; inset:auto 0 0 0; height:50px;
  background:var(--ink); color:var(--marigold);
  display:flex; align-items:center; justify-content:space-between; padding:0 26px;
  font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
}
.foot span:last-child{ color:var(--paper); }

/* ---- the safe centre column ---- */
.stage{
  position:absolute; left:285px; top:52px; width:630px; height:528px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:0;
}
.stage__logo{ margin-bottom:34px; }
h1{
  margin:0; font-weight:800; font-size:56px; line-height:1.07;
  letter-spacing:-.042em;
}
h1 mark{
  background:var(--marigold); color:var(--ink);
  padding:0 .1em; box-decoration-break:clone; -webkit-box-decoration-break:clone;
}
.sub{
  margin:24px 0 0; font-size:21px; line-height:1.4; font-weight:450;
  color:var(--ink-2); max-width:560px;
}
.tags{ display:flex; gap:12px; margin-top:32px; }
.tag{
  border:3px solid var(--ink); background:var(--paper);
  font-family:var(--mono); font-size:15px; font-weight:700;
  padding:9px 14px; box-shadow:4px 4px 0 var(--ink);
}
.tag--mint{ background:var(--mint-l); }
.tag--sky{ background:var(--sky); }

/* ---- the torn-chit motif, in the columns a square crop discards ---- */
.chit{ position:absolute; opacity:1; }
.chit--l{ left:-54px;  top:150px;  transform:rotate(-8deg); }
.chit--r{ right:-62px; top:120px;  transform:rotate(7deg); }
.chit--r2{ right:38px; top:400px;  transform:rotate(-5deg); }
.chit--l2{ left:52px;  top:412px;  transform:rotate(6deg); }

/* The 630-wide safe column. Flip to `block` to check that nothing
   that matters strays outside it, then flip back before rendering
   the committed PNG. */
.guides{ display:none; position:absolute; inset:0; }
.guides i{ position:absolute; top:0; bottom:0; width:2px; background:#E02B3C; opacity:.55; }
.guides i:nth-child(1){ left:285px; }
.guides i:nth-child(2){ left:913px; }
</style>
</head>
<body>

  <div class="ticker">

  <svg class="chit chit--l" width="150" height="196" viewBox="0 0 100 130" aria-hidden="true">

    <g fill="#16130F">
      <rect x="18" y="26" width="64" height="11"/><rect x="18" y="50" width="40" height="11"/>

    <g fill="#16130F">
